<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="720" height="1280" fill="#F5F5F0"/>

  <!-- 标题区域 -->
  <rect y="0" width="720" height="100" fill="#FAFAF5"/>
  <rect y="98" width="720" height="4" fill="#B4B2A8"/>
  <text x="360" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#505050" text-anchor="middle">🐍 康泰园贪吃蛇</text>

  <!-- 小区装饰区 - 顶部道路 -->
  <rect x="50" y="120" width="620" height="30" fill="#B4B2A8" rx="2"/>
  <line x1="60" y1="135" x2="660" y2="135" stroke="#FFF" stroke-width="2" stroke-dasharray="10,10"/>

  <!-- 建筑群 -->
  <rect x="60" y="160" width="80" height="100" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="160" y="160" width="100" height="100" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="280" y="160" width="90" height="100" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="390" y="160" width="100" height="100" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="510" y="160" width="80" height="100" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>

  <!-- 绿化带 -->
  <rect x="60" y="280" width="200" height="40" fill="#B4D2A0" rx="5"/>
  <rect x="280" y="280" width="180" height="40" fill="#B4D2A0" rx="5"/>
  <rect x="480" y="280" width="200" height="40" fill="#B4D2A0" rx="5"/>

  <!-- 游戏主区域 -->
  <rect x="35" y="335" width="650" height="680" fill="#FFFDF5" stroke="#C8B464" stroke-width="3" rx="5"/>

  <!-- 游戏网格 -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E6E6E1" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="35" y="335" width="650" height="680" fill="url(#grid)"/>

  <!-- 小区装饰区 - 底部 -->
  <!-- 绿化区和水景 -->
  <rect x="50" y="1040" width="150" height="60" fill="#B4D2A0" rx="8"/>
  <ellipse cx="280" cy="1070" rx="60" ry="40" fill="#AAC8DC"/>
  <rect x="360" y="1040" width="150" height="60" fill="#B4D2A0" rx="8"/>
  <rect x="530" y="1040" width="140" height="60" fill="#B4D2A0" rx="8"/>

  <!-- 底部道路 -->
  <rect x="50" y="1120" width="620" height="25" fill="#B4B2A8" rx="2"/>
  <line x1="60" y1="1132" x2="660" y2="1132" stroke="#FFF" stroke-width="2" stroke-dasharray="10,10"/>

  <!-- 底部建筑 -->
  <rect x="80" y="1160" width="90" height="70" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="200" y="1160" width="120" height="70" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="350" y="1160" width="100" height="70" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="480" y="1160" width="90" height="70" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>
  <rect x="600" y="1160" width="70" height="70" fill="#C8D2DC" stroke="#64788C" stroke-width="2" rx="3"/>

  <!-- 底部提示 -->
  <rect y="1250" width="720" height="30" fill="#FAFAF5"/>
  <text x="360" y="1268" font-family="Arial, sans-serif" font-size="16" fill="#505050" text-anchor="middle">滑动屏幕控制方向</text>
</svg>